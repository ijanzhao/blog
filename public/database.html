let state={

  activeSp:null,
  hubView:"grouped",
  expanded:{anticancer:true,skin:true,eye:true,nutraceutical:true},
  search:"",
  tab:"products",   // "products" | "chat" | "quickq"
  openProduct:null,
  selStep:null,
  msgs:[],
  loading:false,
};

function setState(patch){
  Object.assign(state,patch);
  render();
}

// ══════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════
async function askAI(text){
  if(!text.trim()||state.loading)return;
  const sp=DB[state.activeSp];
  const newMsgs=[...state.msgs,{role:"user",content:text}];
  setState({msgs:newMsgs,loading:true,tab:"chat"});
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:sp.sysPrompt,messages:newMsgs})
    });
    const data=await res.json();
    const reply=(data.content&&data.content.find(b=>b.type==="text")||{}).text||"无法获取回复";
    setState({msgs:[...newMsgs,{role:"assistant",content:reply}],loading:false});
  }catch(e){
    setState({msgs:[...newMsgs,{role:"assistant",content:"⚠️ API调用失败，请检查网络"}],loading:false});
  }
}

function scoreHTML(val,color,label){
  const r=17,circ=2*Math.PI*r,dash=(val/100)*circ;
  return`<div class="score-box">
    <svg width="38" height="38" style="transform:rotate(-90deg)">
      <circle cx="19" cy="19" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
      <circle cx="19" cy="19" r="${r}" fill="none" stroke="${color}" stroke-width="3"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
      <text x="19" y="19" text-anchor="middle" dominant-baseline="middle"
        style="transform:rotate(90deg);transform-origin:19px 19px;font-size:9px;fill:${color};font-family:monospace;font-weight:700">${val}</text>
    </svg>
    <div class="score-lbl">${label}</div>
  </div>`;
}

function tierBadge(tier){
  const c=TIER_C[tier]||"#94a3b8";
  return`<span class="sp-tier-badge" style="background:${c}20;color:${c};border:1px solid ${c}44">${tier}</span>`;

function productTierBadge(tier){

  return`<span class="product-tier" style="background:${rc}22;color:${rc};border:1px solid ${rc}44">${tier}</span>`;

  }else{
    bc.style.display='none';
    qs.style.display='none';
    hint.style.display='block';
  }
}

// ══════════════════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════════════════
function render(){
  renderHeader();
  const hub=document.getElementById('hub');
  const eng=document.getElementById('engine');
  if(state.view==='hub'){
    hub.style.display='block';
    eng.style.display='none';
    hub.innerHTML=renderHub();
  }else{
    hub.style.display='none';
    eng.style.display='flex';
    eng.innerHTML=renderEngine();
    // scroll chat to bottom
    const cm=document.getElementById('chat-msgs');
    if(cm)cm.scrollTop=cm.scrollHeight;
    // focus input
    const ci=document.getElementById('chat-input');
    if(ci)ci.focus();
  }
}

// init
render();
</script>
</body>
</html>
