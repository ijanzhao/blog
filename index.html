<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 药材数据库</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {font-family:system-ui;margin:0;background:#f8fafc;}
        .container {max-width:800px;margin:40px auto;padding:0 20px;}
        h1 {text-align:center;color:#166534;}
        #root {text-align:center;padding:60px 20px;font-size:18px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 药材数据库</h1>
        <div id="root">正在连接数据库...</div>
    </div>

    <script>
        const supabase = Supabase.createClient(
            'https://jgcibolwmwotsymhgtjr.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnY2lib2x3bXdvdHN5bWhndGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjQxNzMsImV4cCI6MjA5MjY0MDE3M30.-PLwiIxO2_Cq0LjoRmn50_P6Ro-iMk4RqE31Zx0I_CI'
        );

        async function main() {
            const root = document.getElementById('root');
            try {
                const { data, error } = await supabase
                    .from('species')
                    .select('id, name_zh, name_latin')
                    .limit(10);

                if (error) throw error;

                root.innerHTML = `<p style="color:green">✅ 连接成功！获取到 ${data.length} 条数据</p>`;
                console.log(data);
            } catch (e) {
                root.innerHTML = `<p style="color:red">❌ ${e.message}</p>`;
                console.error(e);
            }
        }

        main();
    </script>
</body>
</html>
