<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥材資料庫科研平台</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #14532d;
            --bg-color: #f4f7f6;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 { 
            color: var(--secondary-color); 
            font-size: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            transform: scale(0.98);
        }
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #1e293b; 
            color: #f8fafc;
            border-radius: 8px;
            min-height: 60px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 藥材資料庫</h1>
        
        <button onclick="fetchData()">查詢化合物數據</button>
        
        <div id="result">等待點擊查詢...</div>
    </div>

    <script src="app.js"></script>

</body>
</html>
