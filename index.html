<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药材数据库</title>

<style>
body { font-family: -apple-system, sans-serif; background: #f4f6f8; margin: 0; }
header { background: #0f172a; color: #fff; padding: 20px; text-align: center; }
header h1 { font-size: 22px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding: 20px; }
.card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); cursor:pointer; }
.card:hover { transform: translateY(-2px); }
.card h3 { margin: 0 0 6px; font-size: 18px; }
.card .latin { font-style: italic; color: #4a7c5a; font-size: 14px; }
.msg { padding: 60px; text-align: center; color: #999; }
.err { color: #c0392b; }
</style>

</head>
<body>

<header>
  <h1>🌿 药材数据库</h1>
</header>

<div id="root"><p class="msg">正在加载…</p></div>

<script>

const API = 'https://jgcibolwmwotsymhgtjr.supabase.co/rest/v1/species?select=*';
const KEY = '你的KEY（保持你现在这个）';

async function loadData() {
  const root = document.getElementById('root');

  try {
    const res = await fetch(API, {
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY
      }
    });

    const data = await res.json();

    const grid = document.createElement('div');
    grid.className = 'grid';

    data.forEach(item => {

      const card = document.createElement('div');
      card.className = 'card';

      // ✅ 点击跳转（重点就在这里）
      card.onclick = () => {
        window.location.href = `detail.html?id=${item.id}`;
      };

      const h3 = document.createElement('h3');
      h3.textContent = item.name_zh || '—';

      const latin = document.createElement('p');
      latin.className = 'latin';
      latin.textContent = item.name_latin || '—';

      card.appendChild(h3);
      card.appendChild(latin);

      grid.appendChild(card);
    });

    root.innerHTML = '';
    root.appendChild(grid);

  } catch (err) {
    root.innerHTML = '<p class="msg err">连接失败</p>';
  }
}

loadData();

</script>

</body>
</html>
