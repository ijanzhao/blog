<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildPhytoDB - 科研平台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; padding: 20px; line-height: 1.6; }
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #f4f4f4; 
            border-radius: 8px; 
            white-space: pre-wrap; /* 保持 JSON 格式 */
            font-family: monospace;
        }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 16px; cursor: pointer; background: #14532d; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🌿 药材数据库科研平台</h1>

    <div class="controls">
        <input id="searchKeyword" placeholder="输入搜索关键词...">
        <button onclick="handleSearch()">查询物种</button>
        <button onclick="handleStats()">统计代谢物</button>
    </div>

    <div id="result">等待操作...</div>

    <script src="app.js"></script>
</body>
</html>
