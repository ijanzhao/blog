<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WildPhytoDB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    h1 { color: green; }
    .card { border:1px solid #ddd; padding:15px; margin-top:15px; }
  </style>
</head>

<body>

<h1>🌿 WildPhytoDB</h1>
<p>Cold-region Plant Metabolite Database</p>

<input id="search" placeholder="输入植物名称">
<button onclick="search()">搜索</button>

<div id="result"></div>

<script>
const SUPABASE_URL = "https://你的项目ID.supabase.co";
const SUPABASE_KEY = "你的anon key";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function search() {
  const keyword = document.getElementById("search").value;

  const { data, error } = await supabase
    .from("species")
    .select(`
      id,
      name_zh,
      name_latin,
      family,
      region,
      description,
      species_metabolites (
        metabolites (name, type)
      ),
      species_effects (
        effects (name)
      )
    `)
    .ilike("name_zh", `%${keyword}%`);

  const div = document.getElementById("result");
  div.innerHTML = "";

  if (error) {
    div.innerHTML = "❌ " + error.message;
    return;
  }

  if (data.length === 0) {
    div.innerHTML = "⚠️ 未找到数据";
    return;
  }

  data.forEach(item => {
    const metabolites = item.species_metabolites.map(m => m.metabolites?.name).join(", ");
    const effects = item.species_effects.map(e => e.effects?.name).join(", ");

    div.innerHTML += `
      <div class="card">
        <h2>${item.name_zh} (${item.name_latin})</h2>
        <p><b>科属：</b>${item.family || ""}</p>
        <p><b>区域：</b>${item.region || ""}</p>
        <p><b>描述：</b>${item.description || ""}</p>
        <p><b>代谢物：</b>${metabolites}</p>
        <p><b>功效：</b>${effects}</p>
      </div>
    `;
  });
}
</script>

</body>
</html>
