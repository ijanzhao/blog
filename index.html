<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 铁筷子 R&D 数据库</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui; margin: 0; background: #f0f4f8; }
        .header { background: #14532d; color: white; text-align: center; padding: 32px 20px; }
        .header h1 { margin: 0; font-size: 26px; }
        .header p { margin: 8px 0 0; opacity: 0.8; font-size: 14px; }
        .container { max-width: 960px; margin: 32px auto; padding: 0 20px; }
        #status { text-align: center; padding: 40px; color: #666; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #14532d;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .card h2 { margin: 0 0 12px; font-size: 18px; color: #14532d; }
        .card p { margin: 6px 0; font-size: 14px; color: #444; line-height: 1.5; }
        .tag { display: inline-block; background: #dcfce7; color: #166534;
               font-size: 12px; padding: 2px 8px; border-radius: 99px; margin-top: 8px; }
        .error { color: #dc2626; background: #fef2f2; padding: 16px;
                 border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 铁筷子 R&D 数据库</h1>
        <p>Helleborus thibetanus · 活性成分与靶点</p>
    </div>
    <div class="container">
        <div id="status">正在连接数据库...</div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const { createClient } = window.supabase;
        const db = createClient(
            'https://jgcibolwmwotsymhgtjr.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnY2lib2x3bXdvdHN5bWhndGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjQxNzMsImV4cCI6MjA5MjY0MDE3M30.-PLwiIxO2_Cq0LjoRmn50_P6Ro-iMk4RqE31Zx0I_CI'
        );

        async function main() {
            const status = document.getElementById('status');
            const grid = document.getElementById('grid');
            try {
                const { data, error } = await db
                    .from('v_compound_full')
                    .select('*');
                if (error) throw error;

                status.innerHTML = `<p style="color:#166534">✅ 已加载 ${data.length} 条记录</p>`;
                grid.innerHTML = data.map((item, i) => `
                    <div class="card" onclick="location.href='detail.html?i=${i}'"
                         data-index="${i}">
                        <h2>${item.compound || '未命名化合物'}</h2>
                        <p>🎯 <b>靶点：</b>${item.target || '—'}</p>
                        <p>🧠 <b>通路：</b>${item.pathway || '—'}</p>
                        <span class="tag">查看详情 →</span>
                    </div>
                `).join('');

                // 存入sessionStorage供detail页使用
                sessionStorage.setItem('compounds', JSON.stringify(data));

            } catch (e) {
                status.innerHTML = `<div class="error">❌ 连接失败：${e.message}</div>`;
                console.error(e);
            }
        }
        main();
    </script>
</body>
</html>
