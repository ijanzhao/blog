<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 药材数据库</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui; margin: 0; background: #f0f4f0; }
        .header { background: #14532d; color: white; text-align: center; padding: 32px 20px; }
        .header h1 { margin: 0; font-size: 28px; }
        .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
        #status { text-align: center; padding: 40px; font-size: 16px; color: #666; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .card .name-zh { font-size: 20px; font-weight: bold; color: #14532d; margin-bottom: 4px; }
        .card .name-latin { font-size: 13px; color: #888; font-style: italic; margin-bottom: 10px; }
        .card .desc { font-size: 14px; color: #444; line-height: 1.5; }
        .error { color: #dc2626; background: #fef2f2; padding: 16px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌿 药材数据库</h1>
    </div>
    <div class="container">
        <div id="status">正在连接数据库...</div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const { createClient } = window.supabase;

        const db = createClient(
            'https://jgcibolwmwotsymhgtjr.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnY2lib2x3bXdvdHN5bWhndGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjQxNzMsImV4cCI6MjA5MjY0MDE3M30.-PLwiIxO2_Cq0LjoRmn50_P6Ro-iMk4RqE31Zx0I_CI'
        );

        async function main() {
            const status = document.getElementById('status');
            const grid = document.getElementById('grid');

            try {
                const { data, error } = await db
                    .from('species')
                    .select('id, name_zh, name_latin, description')
                    .order('name_zh');

                if (error) throw error;

                status.innerHTML = `<p style="color:#166534">✅ 已加载 ${data.length} 种药材</p>`;

                grid.innerHTML = data.map(herb => `
                    <div class="card" onclick="location.href='detail.html?id=${herb.id}'">
                        <div class="name-zh">${herb.name_zh || '—'}</div>
                        <div class="name-latin">${herb.name_latin || ''}</div>
                        <div class="desc">${herb.description || ''}</div>
                    </div>
                `).join('');

            } catch (e) {
                status.innerHTML = `<div class="error">❌ 连接失败：${e.message}</div>`;
                console.error(e);
            }
        }

        main();
    </script>
</body>
</html>
