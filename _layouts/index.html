<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>玄光山人 · 药材数据库</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont;
      margin:0;
      background:#f4f6f8;
    }
    header{
      background:#0f172a;
      color:white;
      padding:20px;
      text-align:center;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:20px;
    }
    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 ijanzhao· 药材数据库</h1>
  <p>Supabase 实时数据版</p>
</header>

<div class="grid" id="grid"></div>

<script>
  const supabaseUrl = '你的Project URL';
  const supabaseKey = '你的anon public key';

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  async function loadHerbs() {
    const { data, error } = await client
      .from('species')
      .select('*');

    const grid = document.getElementById('grid');

    if (error) {
      grid.innerHTML = '<p>数据库连接失败</p>';
      console.error(error);
      return;
    }

    grid.innerHTML = data.map(item => `
      <div class="card">
        <h3>${item.name_zh}</h3>
        <p>${item.name_latin}</p>
      </div>
    `).join('');
  }

  loadHerbs();
</script>

</body>
</html>
