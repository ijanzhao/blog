<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://jgcibolwmwotsymhgtjr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_K_DnINBvp73Wf4XrvbTbtw';

  const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 測試連接（可先保留，之後可刪除）
  async function checkConnection() {
    try {
      const { data, error } = await supabase
        .from('species')
        .select('*')
        .limit(1);

      if (error) {
        console.error('連接失敗:', error);
        document.getElementById('db-status') && (document.getElementById('db-status').innerText = '數據庫連接失敗: ' + error.message);
      } else {
        console.log('✅ 數據庫連接成功');
        document.getElementById('db-status') && (document.getElementById('db-status').innerText = '數據庫連接成功');
      }
    } catch (err) {
      console.error('錯誤:', err);
    }
  }

  window.onload = checkConnection;
</script>
