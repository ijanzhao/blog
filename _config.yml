<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://jgcibolwmwotsymhgtjr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_K_DnINBvp73Wf4XrvbTbtw';

  const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 測試數據庫連接
  async function checkConnection() {
    try {
      const { data, error } = await supabase
        .from('species')
        .select('*')
        .limit(1);

      if (error) {
        console.error('數據庫連接失敗:', error);
        const statusEl = document.getElementById('db-status');
        if (statusEl) statusEl.innerHTML = '數據庫連接失敗: ' + error.message;
      } else {
        console.log('✅ 數據庫連接成功！');
        const statusEl = document.getElementById('db-status');
        if (statusEl) statusEl.innerHTML = '數據庫連接成功';
      }
    } catch (err) {
      console.error('連接異常:', err);
    }
  }

  // 頁面載入後執行測試
  window.onload = checkConnection;
</script>
