name: MD Scoring Tests (preliminary)

on:
  push:
    branches:
      - research/md-scoring-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run MD scoring tests
        run: npm run test:md
