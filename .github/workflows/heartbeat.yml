name: Heartbeat

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ijan.app
        env:
          SUPABASE_PROD_PUBLISHABLE_KEY: ${{ secrets.IJAN_APP_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_PROD_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing repository secret IJAN_APP_ANON_KEY"
            exit 1
          fi
          curl --silent --show-error --fail-with-body \
            --write-out "\nHTTP %{http_code}\n" \
            -X PATCH "https://gotdehypsbkbyrasdbrr.supabase.co/rest/v1/_keep_alive_heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_PROD_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PROD_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "ijan.app OK"

      - name: Ping ijanzhao-app
        env:
          SUPABASE_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.IJANZHAO_APP_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_SANDBOX_PUBLISHABLE_KEY" ]; then
            echo "::warning::Skipping sandbox heartbeat: repository secret IJANZHAO_APP_ANON_KEY is not configured"
            exit 0
          fi
          curl --silent --show-error --fail-with-body \
            --write-out "\nHTTP %{http_code}\n" \
            -X PATCH "https://jgcibolwmwotsymhgtjr.supabase.co/rest/v1/_keep_alive_heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_SANDBOX_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SANDBOX_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "ijanzhao-app sandbox OK"

  keepalive:
    runs-on: ubuntu-latest
    needs: ping
    if: always()
    permissions:
      actions: write
    steps:
      - name: Reset 60-day inactivity counter
        run: |
          curl --silent --show-error --fail-with-body \
            -X PUT \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/heartbeat.yml/enable" \
            -H "Authorization: token ${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
