name: Heartbeat

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ijan.app
        run: |
          curl --silent --show-error --fail-with-body \
            --write-out "\nHTTP %{http_code}\n" \
            -X PATCH "https://gotdehypsbkbyrasdbrr.supabase.co/rest/v1/_keep_alive_heartbeat?id=eq.1" \
            -H "apikey: sb_publishable_K_DnINBvp73Wf4XrvbTbtw_49N2e20u" \
            -H "Authorization: Bearer sb_publishable_K_DnINBvp73Wf4XrvbTbtw_49N2e20u" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "ijan.app OK"

      - name: Ping ijanzhao-app
        run: |
          curl --silent --show-error --fail-with-body \
            --write-out "\nHTTP %{http_code}\n" \
            -X PATCH "https://jgcibolwmwotsymhgtjr.supabase.co/rest/v1/_keep_alive_heartbeat?id=eq.1" \
            -H "apikey: sb_publishable_K_DnINBvp73Wf4XrvbTbtw_49N2e20u" \
            -H "Authorization: Bearer sb_publishable_K_DnINBvp73Wf4XrvbTbtw_49N2e20u" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "ijanzhao-app OK"

  keepalive:
    runs-on: ubuntu-latest
    needs: ping
    if: always()
    permissions:
      actions: write
    steps:
      - name: Reset 60-day inactivity counter
        run: |
          curl --silent --show-error --fail-with-body \
            -X PUT \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/heartbeat.yml/enable" \
            -H "Authorization: token ${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
