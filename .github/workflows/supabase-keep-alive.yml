name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ijan.app
        run: |
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "https://gotdehypsbkbyrasdbrr.supabase.co/rest/v1/_keep_alive_heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.IJAN_APP_ANON_KEY }}")
          echo "HTTP status: $STATUS"; cat /tmp/resp.json
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::ijan.app ping failed with status $STATUS"
            exit 1
          fi

      - name: Ping ijanzhao-app
        run: |
          STATUS=$(curl -sS -o /tmp/resp2.json -w "%{http_code}" \
            "https://jgcibolwmwotsymhgtjr.supabase.co/rest/v1/_keep_alive_heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.IJANZHAO_APP_ANON_KEY }}")
          echo "HTTP status: $STATUS"; cat /tmp/resp2.json
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::ijanzhao-app ping failed with status $STATUS"
            exit 1
          fi
