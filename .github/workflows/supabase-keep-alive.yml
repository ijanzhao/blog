name: Prevent Supabase Inactivity<br/><br/>on:<br/>  schedule:<br/>    # 每周一和周四的午夜 00:00 (UTC 时间) 自动运行<br/>    - cron: '0 0 * * 1,4'<br/>  workflow_dispatch: # 允许手动点击触发测试<br/><br/>jobs:<br/>  ping-supabase:<br/>    runs-on: ubuntu-latest<br/><br/>    steps:<br/>      - name: Ping Supabase Edge Function<br/>        run: |<br/>          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/quick-handler" \<br/>            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \<br/>            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")<br/>          <br/>          echo "Supabase API responded with Status Code: $STATUS_CODE"<br/>          <br/>          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 401 ] || [ "$STATUS_CODE" -eq 400 ]; then<br/>            echo "Successfully pinged Supabase. Database is active!"<br/>          else<br/>            echo "Unexpected status code $STATUS_CODE, but database was hit."<br/>          fi
