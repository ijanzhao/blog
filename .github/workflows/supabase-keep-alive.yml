name: Prevent Supabase Inactivity

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase API
        run: |
          curl -L "${{ secrets.SUPABASE_URL }}/rest/v1/"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
