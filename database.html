// ── Score Ring ──────────────────────────────────────────────────
function ScoreRing({ value, size = 44, color, label }) {
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (value / 100) * circ;
  return (
    <div style={{ textAlign: "center" }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={3}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={3}
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
        <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="middle"
          style={{ transform: `rotate(90deg)`, transformOrigin: `${size/2}px ${size/2}px`,
            fontSize: 10, fill: color, fontFamily: "monospace", fontWeight: 700 }}>{value}</text>
      </svg>
      <div style={{ fontSize: 9, color: "rgba(255,255,255,0.3)", fontFamily: "monospace", marginTop: 1 }}>{label}</div>
    </div>
  );
}

// ── TRL Dots ────────────────────────────────────────────────────
function TRLDots({ level, color }) {
  return (
    <div style={{ display: "flex", gap: 3, alignItems: "center" }}>
      {Array.from({ length: 9 }, (_, i) => (
        <div key={i} style={{
          width: i < level ? 7 : 5, height: i < level ? 7 : 5, borderRadius: "50%",
          background: i < level ? color : "rgba(255,255,255,0.08)",
          boxShadow: i < level ? `0 0 5px ${color}55` : "none", transition: "all 0.3s",
        }}/>
      ))}
      <span style={{ fontSize: 9, color: "rgba(255,255,255,0.3)", fontFamily: "monospace", marginLeft: 3 }}>TRL {level}</span>
    </div>
  );
}

// ── Track Group ─────────────────────────────────────────────────
function TrackGroup({ track, onSelect, search, isExpanded, onToggle, idx }) {
  const members = track.members.map(id => SPECIES_DB[id]).filter(sp => {
    if (!search) return true;
    const q = search.toLowerCase();
    return sp.chinese.includes(q) || sp.latin.toLowerCase().includes(q) || sp.alias.toLowerCase().includes(q);
  });
  if (members.length === 0) return null;
  return (
    <div style={{
      borderRadius: 10, overflow: "hidden",
      border: `1px solid ${isExpanded ? track.color+"44" : "rgba(255,255,255,0.07)"}`,
      background: isExpanded ? `${track.color}06` : "rgba(255,255,255,0.015)",
      transition: "all 0.25s", animation: `fadeIn 0.4s ${idx * 0.1}s both`,
    }}>
      <div onClick={onToggle} style={{ padding: "14px 22px", display: "flex", alignItems: "center",
        gap: 14, cursor: "pointer",
        borderBottom: isExpanded ? `1px solid ${track.color}22` : "none" }}>
        <div style={{ width: 36, height: 36, borderRadius: 7, background: `${track.color}22`,
          border: `1px solid ${track.color}44`, display: "flex", alignItems: "center",
          justifyContent: "center", fontSize: 17, color: track.accent }}>{track.icon}</div>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
            <span style={{ fontSize: 14, fontWeight: 500, color: track.accent, letterSpacing: 1 }}>{track.label}</span>
            <span style={{ fontSize: 9, color: "rgba(255,255,255,0.22)", fontFamily: "monospace", letterSpacing: 2 }}>{track.en}</span>
          </div>
          <span style={{ fontSize: 11, color: "rgba(255,255,255,0.32)" }}>{track.desc}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ display: "flex", gap: 4 }}>
            {members.map(sp => (
              <div key={sp.id} style={{ width: 22, height: 22, borderRadius: 5, background: `${sp.color}22`,
                border: `1px solid ${sp.color}44`, display: "flex", alignItems: "center",
                justifyContent: "center", fontSize: 11, color: sp.accent }}>{sp.glyph}</div>
            ))}
          </div>
          <span style={{ padding: "2px 7px", borderRadius: 10, fontSize: 9, fontFamily: "monospace",
            background: `${track.color}22`, color: track.accent, border: `1px solid ${track.color}44` }}>{members.length}种</span>
          <span style={{ fontSize: 14, color: isExpanded ? track.accent : "rgba(255,255,255,0.2)",
            transition: "transform 0.2s", display: "inline-block",
            transform: isExpanded ? "rotate(90deg)" : "none" }}>›</span>
        </div>
      </div>
      {isExpanded && (
        <div style={{ padding: "10px 14px", display: "flex", flexDirection: "column", gap: 7 }}>
          {members.map(sp => <CompactCard key={sp.id} sp={sp} onSelect={onSelect}/>)}
        </div>
      )}
    </div>
  );
}

// ── Plant Engine ────────────────────────────────────────────────
function PlantEngine({ sp, onBack }) {
  const [tab, setTab] = React.useState("chat");
  const [msgs, setMsgs] = React.useState([]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [expandedInnov, setExpandedInnov] = React.useState(null);
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [msgs]);

  const callAI = async (text) => {
    if (!text.trim() || loading) return;
    setLoading(true);
    const newMsgs = [...msgs, { role: "user", content: text }];
    setMsgs(newMsgs); setInput(""); setTab("chat");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000,
          system: sp.systemPrompt, messages: newMsgs }),
      });
      const data = await res.json();
      const reply = (data.content && data.content.find(b => b.type === "text") || {}).text || "无法获取回复";
      setMsgs([...newMsgs, { role: "assistant", content: reply }]);
    } catch(e) { setMsgs([...newMsgs, { role: "assistant", content: "⚠️ API调用失败" }]); }
    finally { setLoading(false); }
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", animation: "fadeIn 0.3s both" }}>
      {/* Engine header */}
      <div style={{ padding: "13px 24px", borderBottom: "1px solid rgba(255,255,255,0.06)",
        background: `linear-gradient(135deg, ${sp.color}18, transparent)`,
        display: "flex", alignItems: "center", gap: 13 }}>
        <button onClick={onBack} style={{ width: 30, height: 30, borderRadius: "50%",
          border: "1px solid rgba(255,255,255,0.12)", background: "rgba(255,255,255,0.05)",
          color: "rgba(255,255,255,0.6)", cursor: "pointer", fontSize: 14,
          display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
        <div style={{ width: 34, height: 34, borderRadius: 7, background: `${sp.color}22`,
          border: `1px solid ${sp.color}44`, display: "flex", alignItems: "center",
          justifyContent: "center", fontSize: 15, color: sp.accent }}>{sp.glyph}</div>
        <div>
          <div style={{ fontSize: 14, color: sp.accent, fontWeight: 500, letterSpacing: 1 }}>
            {sp.chinese} · 研发分析引擎</div>
          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.28)", fontStyle: "italic", fontFamily: "monospace" }}>
            {sp.latin} · {sp.alias}</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 5 }}>
          {[["chat","AI顾问"],["innovations","创新方向"],["quickq","快捷问题"]].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: "5px 12px", borderRadius: 4, fontSize: 11, cursor: "pointer", fontFamily: "monospace",
              border: `1px solid ${tab === id ? sp.color+"88" : "rgba(255,255,255,0.08)"}`,
              background: tab === id ? `${sp.color}22` : "transparent",
              color: tab === id ? sp.accent : "rgba(255,255,255,0.3)", transition: "all 0.2s",
            }}>{label}</button>

        </div>
      </div>

      {/* Chat */}
      {tab === "chat" && (<>
        <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px" }}>
          {msgs.length === 0 && (
            <div style={{ textAlign: "center", paddingTop: 48, opacity: 0.5 }}>
              <div style={{ fontSize: 32, marginBottom: 10, color: sp.accent }}>{sp.glyph}</div>
              <p style={{ color: sp.accent, fontSize: 13, letterSpacing: 2 }}>{sp.chinese}专项AI顾问已就位</p>

              flexDirection: m.role === "user" ? "row-reverse" : "row" }}>

            {sp.quickQ.map((q, i) => (
              <button key={i} onClick={() => callAI(q)}
                style={{ padding: "12px 16px", borderRadius: 7, textAlign: "left",
                  background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.07)",
                  color: "rgba(232,234,240,0.65)", cursor: "pointer", fontSize: 12,
                  fontFamily: "Georgia, serif", lineHeight: 1.5, transition: "all 0.2s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = sp.color+"55"; e.currentTarget.style.background = `${sp.color}0d`; e.currentTarget.style.color = "#e8eaf0"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.07)"; e.currentTarget.style.background = "rgba(255,255,255,0.02)"; e.currentTarget.style.color = "rgba(232,234,240,0.65)"; }}>
                <span style={{ color: sp.accent, marginRight: 8, fontSize: 11 }}>→</span>{q}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Root App ─────────────────────────────────────────────────────
function App() {
  const [activePlant, setActivePlant] = React.useState(null);
  return (
    <div style={{ minHeight: "100vh", background: "#07090d",
      fontFamily: "Georgia, 'Times New Roman', Palatino, serif", color: "#e8eaf0",
      display: "flex", flexDirection: "column",
      backgroundImage: `radial-gradient(ellipse at 10% 0%, rgba(30,60,120,0.14) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 100%, rgba(15,40,25,0.18) 0%, transparent 45%)` }}>
      {/* Header */}
      <header style={{ padding: "12px 28px", borderBottom: "1px solid rgba(255,255,255,0.05)",
        display: "flex", alignItems: "center", gap: 14,
        background: "rgba(7,9,13,0.92)", backdropFilter: "blur(16px)",
        position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}
          onClick={() => setActivePlant(null)}>
          <div style={{ width: 30, height: 30, borderRadius: 7,
            background: "linear-gradient(135deg, rgba(100,200,120,0.18), rgba(60,120,180,0.18))",
            border: "1px solid rgba(255,255,255,0.1)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>⬡</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 500, color: "#c8d8e8", letterSpacing: 2 }}>冷域本草 · 研发智库</div>
            <div style={{ fontSize: 9, color: "rgba(200,216,232,0.3)", letterSpacing: 4, fontFamily: "monospace" }}>
              COLD-DOMAIN BOTANICS · R&amp;D INTELLIGENCE</div>
          </div>
        </div>
        {activePlant && (
          <div style={{ display: "flex", alignItems: "center", gap: 7, marginLeft: 6 }}>
            <span style={{ color: "rgba(255,255,255,0.18)", fontSize: 12 }}>/</span>
            <span style={{ fontSize: 11, color: "rgba(255,255,255,0.32)", cursor: "pointer", fontFamily: "monospace" }}
              onClick={() => setActivePlant(null)}>物种数据库</span>
            <span style={{ color: "rgba(255,255,255,0.18)", fontSize: 12 }}>/</span>
            <span style={{ fontSize: 11, color: activePlant.accent, fontFamily: "monospace" }}>
              {activePlant.chinese}</span>
          </div>
        )}
        {activePlant && (
          <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
            {Object.values(SPECIES_DB).map(sp => (
              <button key={sp.id} onClick={() => setActivePlant(sp)} title={sp.chinese} style={{
                width: 26, height: 26, borderRadius: 5, cursor: "pointer", fontSize: 11,
                display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s",
                border: `1px solid ${activePlant.id === sp.id ? sp.color+"88" : "rgba(255,255,255,0.07)"}`,
                background: activePlant.id === sp.id ? `${sp.color}22` : "rgba(255,255,255,0.03)",
                color: activePlant.id === sp.id ? sp.accent : "rgba(255,255,255,0.28)",
              }}>{sp.glyph}</button>
            ))}
          </div>
        )}
        {!activePlant && (
          <div style={{ marginLeft: "auto", fontSize: 10, color: "rgba(255,255,255,0.18)", fontFamily: "monospace" }}>
            点击物种卡片进入专项分析引擎</div>
        )}
      </header>
      {/* Body */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {!activePlant
          ? <SpeciesHub onSelect={setActivePlant}/>
          : <PlantEngine sp={activePlant} onBack={() => setActivePlant(null)}/>}
      </div>
      <style>{`
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes dot { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(7,9,13,.8); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        input:focus, textarea:focus { border-color: rgba(255,255,255,0.22) !important; }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.18); }
        button { outline: none; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
