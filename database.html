<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ijan.app | phytochemical database</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 保持您要求的简约、全小写风格 */
        body { font-family: 'Inter', sans-serif; color: #333; margin: 0; padding: 20px; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: -1px; margin-bottom: 30px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { border: 1px solid #eee; padding: 20px; border-radius: 8px; transition: all 0.3s; }
        
        /* 核心权限样式：模糊处理 */
        .locked-content {
            filter: blur(5px);
            user-select: none;
            pointer-events: none;
            background: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
        }
        .lock-overlay {
            position: relative;
            border: 1px dashed #ccc;
            padding: 15px;
            text-align: center;
        }
        button.apply-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <div class="logo">ijan.app</div>

    <div id="auth-status" style="margin-bottom: 20px; font-size: 14px;">
        </div>

    <div class="grid" id="compound-list">
        </div>

    <script>
        // 1. 初始化 Supabase
        const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

        async function initApp() {
            const { data: { user } } = await supabase.auth.getUser();
            let userRole = 'visitor'; // 默认为注册后的基础权限

            if (user) {
                // 从 profile 表获取用户角色 (researcher / collaborator)
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();
                if (profile) userRole = profile.role;
                
                document.getElementById('auth-status').innerHTML = `
                    logged in as: <strong>${user.email}</strong> [${userRole}] 
                    | <a href="#" onclick="supabase.auth.signOut()">logout</a>`;
            } else {
                document.getElementById('auth-status').innerHTML = `<a href="login.html">login / register</a> to see advanced data`;
            }

            fetchCompounds(userRole);
        }

        async function fetchCompounds(role) {
            const { data: compounds, error } = await supabase.from('compounds').select('*');
            const container = document.getElementById('compound-list');
            container.innerHTML = '';

            compounds.forEach(item => {
                const isAuthorized = ['researcher', 'collaborator'].includes(role);
                
                container.innerHTML += `
                    <div class="card">
                        <h3>${item.name.toLowerCase()}</h3>
                        <p><small>taxonomy: ${item.taxonomy}</small></p>
                        
                        ${isAuthorized ? `
                            <div class="data-box">
                                <strong>activity data:</strong>
                                <p>${item.activity_data || 'pending research...'}</p>
                            </div>
                        ` : `
                            <div class="lock-overlay">
                                <div class="locked-content">hidden activity data</div>
                                <p style="font-size: 12px; color: #666;">restricted to researcher accounts</p>
                                <button class="apply-btn" onclick="location.href='/apply'">request access</button>
                            </div>
                        `}
                    </div>
                `;
            });
        }

        initApp();
    </script>
</body>
</html>
