<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WildPhytoDB · ijan.app</title>

<style>
body{font-family:Arial;background:#0b0f14;color:#e8e4dc;margin:0}
nav{padding:12px 20px;background:#111;border-bottom:1px solid #222}
.container{padding:20px;max-width:1000px;margin:auto}

input,button{
  padding:10px;
  font-family:monospace;
}

button{
  background:#6aab7e;
  border:none;
  cursor:pointer;
}

table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{border-bottom:1px solid #222;padding:10px;font-size:13px}
th{color:#6aab7e;text-align:left}

.ai-box{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

#ai-result{
  margin-top:20px;
  padding:15px;
  border:1px solid #333;
  display:none;
  background:#111;
}
</style>

</head>

<body>

<nav>
  🌿 WildPhytoDB · ijan.app
</nav>

<div class="container">

<!-- AI 输入区 -->
<div class="ai-box">
  <input id="ai-species" placeholder="输入植物名称，例如 Helleborus">
  <button onclick="runAIAnalysis()">AI Analyze</button>
</div>

<div id="ai-result"></div>

<!-- Species Table -->
<h3>Species</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Latin</th>
<th>Chinese</th>
<th>Description</th>
</tr>
</thead>
<tbody id="sp-body"></tbody>
</table>

</div>

<script>
// =====================
// Supabase config
// =====================
var SB = "https://jgcibolwmwotsymhgtjr.supabase.co";
var KEY = "YOUR_ANON_KEY";

// =====================
// fetch helper
// =====================
function get(url){
  return fetch(SB + url, {
    headers:{
      apikey: KEY,
      Authorization: "Bearer " + KEY
    }
  }).then(r=>r.json());
}

// =====================
// load species
// =====================
function loadSpecies(){
  var tbody = document.getElementById("sp-body");

  get("/rest/v1/species?select=*")
  .then(function(d){

    if(!d || !d.length){
      tbody.innerHTML = "<tr><td colspan='4'>暂无数据</td></tr>";
      return;
    }

    tbody.innerHTML = d.map(function(r,i){
      return `
        <tr>
          <td>${i+1}</td>
          <td>${r.name_latin || "-"}</td>
          <td>${r.name_zh || "-"}</td>
          <td>${r.description || "-"}</td>
        </tr>
      `;
    }).join("");

  });
}

// =====================
// AI function
// =====================
function runAIAnalysis(){

  var species = document.getElementById("ai-species").value;

  if(!species){
    alert("请输入植物名称");
    return;
  }

  var box = document.getElementById("ai-result");
  box.style.display = "block";
  box.innerHTML = "🧠 AI分析中...";

  fetch(SB + "/functions/v1/analyze_species", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      apikey: KEY
    },
    body: JSON.stringify({
      species: species,
      compounds:[]
    })
  })
  .then(r=>r.json())
  .then(function(d){

    box.innerHTML = `
      <h3 style="color:#6aab7e">AI Research Report</h3>
      <p><b>Species:</b> ${d.species}</p>
      <p><b>Mechanism:</b> ${d.mechanism}</p>
      <p><b>Bioactivity:</b> ${d.bioactivity}</p>
      <p><b>Risk:</b> ${d.risk}</p>
      <p><b>Summary:</b> ${d.summary}</p>
    `;

  })
  .catch(function(e){
    box.innerHTML = "❌ " + e.message;
  });

}

// =====================
// init
// =====================
loadSpecies();

</script>

</body>
</html>
