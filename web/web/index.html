<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WildPhytoDB</title>
</head>
<body>

<h1>🌿 WildPhytoDB</h1>

<input id="search" placeholder="输入植物名称">
<button onclick="search()">搜索</button>

<div id="result"></div>

<script>
const data = [
  {name:"覆盆子",desc:"抗氧化、抗炎"},
  {name:"铁筷子",desc:"抗肿瘤"}
];

function search(){
  let kw = document.getElementById("search").value;
  let res = data.filter(d=>d.name.includes(kw));

  document.getElementById("result").innerHTML =
    res.map(r=>`<p><b>${r.name}</b> - ${r.desc}</p>`).join("");
}
</script>

</body>
</html>
